<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZIZBEK PRO APP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
    :root { 
        --bg-base: #020408; 
        --bg-surface: #0a0f1d;
        --bg-card: rgba(255, 255, 255, 0.03);
        --bg-card-hover: rgba(255, 255, 255, 0.07);
        --accent-primary: #3b82f6; 
        --accent-glow: rgba(59, 130, 246, 0.5);
        --text-main: #ffffff;
        --text-muted: #94a3b8;
        --border-glass: rgba(255, 255, 255, 0.08);
        --glass-effect: blur(20px) saturate(180%);
    }
    
    body { 
        background-color: var(--bg-base); 
        color: var(--text-main); 
        font-family: 'Poppins', 'Inter', sans-serif; 
        overflow-x: hidden; 
        -webkit-tap-highlight-color: transparent;
        line-height: 1.5;
    }

    h1, h2, h3 {
        font-family: 'Poppins', sans-serif;
        letter-spacing: -0.02em;
    }

    .glass-panel {
        background: rgba(10, 15, 29, 0.7);
        backdrop-filter: var(--glass-effect);
        -webkit-backdrop-filter: var(--glass-effect);
        border: 1px solid var(--border-glass);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .music-card {
        background: var(--bg-card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    .music-card:active {
        transform: scale(0.95);
        background: var(--bg-card-hover);
        border-color: rgba(59, 130, 246, 0.3);
    }

    .play-overlay {
        position: absolute;
        inset: 0;
        background: rgba(59, 130, 246, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.3s ease;
    }

    .music-card:active .play-overlay { 
        opacity: 1;
    }

    .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
        scroll-behavior: smooth;
    }
    .hide-scroll::-webkit-scrollbar { display: none; }
    
    .fade-in { 
        animation: fadeIn 0.6s ease forwards; 
    }
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(20px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    
    .slide-up { 
        transform: translateY(100%); 
        transition: transform 0.4s ease; 
    }
    .slide-up.active { 
        transform: translateY(0); 
    }

    .neon-avatar {
        position: relative;
        padding: 3px;
        background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
        border-radius: 50%;
        animation: neonRotate 4s linear infinite;
        background-size: 200% 200%;
    }
    @keyframes neonRotate {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .progress-container { 
        width: 100%; 
        height: 4px; 
        background: rgba(255, 255, 255, 0.05); 
        border-radius: 10px; 
        cursor: pointer; 
        position: relative;
    }
    .progress-bar { 
        height: 100%; 
        background: linear-gradient(90deg, #3b82f6, #60a5fa); 
        border-radius: 10px; 
        width: 0%; 
        position: relative; 
        box-shadow: 0 0 10px var(--accent-glow);
    }

    nav.glass-panel {
        border-radius: 20px 20px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: env(safe-area-inset-bottom);
    }

    .volume-slider {
        width: 100%;
        height: 3px;
        border-radius: 5px;
        background: linear-gradient(to right, #3b82f6, #60a5fa);
        outline: none;
        -webkit-appearance: none;
    }

    .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        cursor: pointer;
    }

    .stat-box {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
    }

    .stat-number {
        font-size: 22px;
        font-weight: bold;
        color: #3b82f6;
    }

    .stat-label {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
    }

    .share-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: flex-end;
        z-index: 999;
    }

    .share-modal.active {
        display: flex;
    }

    .share-sheet {
        background: #0a0f1d;
        width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 16px;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    </style>

</head>
<body class="pb-28">

    <!-- Header -->
    <header class="px-4 py-3 flex justify-between items-center sticky top-0 z-40 glass-panel border-b-0">
        <button class="text-lg text-slate-400 hover:text-white transition">
            <i class="fas fa-bars-staggered"></i>
        </button>
        <h1 class="text-lg font-bold text-white italic uppercase flex items-center gap-1">
            AZIZBEK <span class="text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded text-xs">PRO</span>
        </h1>
        <button onclick="showFavorites()" class="text-lg text-red-500 hover:scale-110 transition">
            <i class="fas fa-heart"></i>
        </button>
    </header>

    <!-- Main Views -->
    <main id="view-home" class="fade-in pb-4">
        <div class="pt-4 pb-2">
            <div id="stories-container" class="flex gap-3 px-4 overflow-x-auto hide-scroll snap-x"></div>
        </div>
        <div id="dynamic-content" class="pb-4">
            <div class="flex justify-center items-center h-32">
                <div class="w-6 h-6 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </main>

    <main id="view-news" class="hidden px-4 py-6 fade-in">
        <h2 class="font-bold text-xl mb-6 text-white">Yangiliklar</h2>
        <div id="news-area" class="grid gap-4"></div>
    </main>

    <main id="view-profile" class="hidden px-4 py-6 text-center fade-in">
        <h2 class="font-bold text-xl mb-6 text-white">Mening Profilim</h2>
        <div id="profile-area" class="flex flex-col items-center">
            <div class="relative w-24 h-24 mx-auto mb-4 neon-avatar">
                <img id="profile-img" src="https://raw.githubusercontent.com/azziyy/Tabrik/refs/heads/main/Screenshot_2026-05-12-19-14-39-471_com.instagram.android.png" class="w-full h-full rounded-full object-cover">
            </div>
            <h3 class="text-xl font-bold text-white mb-4">Azizbek</h3>
            
            <!-- Statistics -->
            <div class="grid grid-cols-3 gap-2 w-full mb-6">
                <div class="stat-box">
                    <span class="stat-number" id="stat-songs">0</span>
                    <span class="stat-label">Qo'shiq</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-hours">0</span>
                    <span class="stat-label">Soat</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-favorites">0</span>
                    <span class="stat-label">Sevimli</span>
                </div>
            </div>

            <!-- Bio -->
            <div class="music-card p-4 rounded-lg text-left w-full">
                <h4 class="text-white font-semibold mb-2">📝 Haqimda</h4>
                <p class="text-slate-300 text-sm">🎵 Musiqa sevuvchi | 💻 Developer | 🚀 Innovator</p>
            </div>
        </div>
    </main>

    <main id="view-favorites" class="hidden px-4 py-6 fade-in">
        <h2 class="font-bold text-xl mb-6 text-white flex items-center gap-2">
            <i class="fas fa-heart text-red-500"></i> Sevimlilar
        </h2>
        <div id="favorites-area" class="flex flex-col gap-2"></div>
    </main>

    <!-- Mini Player -->
    <div id="mini-player" class="fixed bottom-24 left-3 right-3 glass-panel rounded-2xl p-2 z-30 hidden transition-all cursor-pointer shadow-xl" onclick="openFullPlayer()">
        <div class="flex items-center gap-3 px-2 py-1">
            <div class="relative w-12 h-12 rounded-lg overflow-hidden shrink-0">
                <img id="mp-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 min-w-0">
                <h4 id="mp-title" class="truncate font-bold text-sm text-white mb-0.5">Nomi</h4>
                <p id="mp-artist" class="text-xs text-slate-400 truncate">San'atkor</p>
            </div>
            <button class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center" onclick="togglePlay(event)">
                <i id="mp-icon" class="fas fa-play text-white text-xs ml-0.5"></i>
            </button>
        </div>
    </div>

    <!-- Full Player -->
    <div id="full-player" class="fixed inset-0 bg-[#020408] z-50 slide-up flex flex-col overflow-auto">
        <div class="absolute inset-0 z-0">
            <img id="fp-bg-blur" src="" class="w-full h-full object-cover opacity-20 blur-3xl">
            <div class="absolute inset-0 bg-gradient-to-t from-[#020408]"></div>
        </div>

        <div class="relative z-10 flex flex-col px-4 py-6">
            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <button onclick="closeFullPlayer()" class="w-10 h-10 flex items-center justify-center text-lg text-white/70 bg-white/5 rounded-lg">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <p class="text-xs tracking-widest uppercase font-bold text-white/40">Playing</p>
                <button onclick="toggleFavoriteCurrent()" class="w-10 h-10 flex items-center justify-center text-lg bg-white/5 rounded-lg">
                    <i id="fp-heart" class="far fa-heart text-white/70"></i>
                </button>
            </div>
            
            <!-- Album Art -->
            <div class="flex items-center justify-center mb-6">
                <div class="w-40 h-40">
                    <img id="fp-img" src="" class="w-full h-full rounded-3xl object-cover shadow-lg">
                </div>
            </div>
            
            <!-- Info -->
            <div class="mb-6">
                <h2 id="fp-title" class="text-2xl font-bold text-white mb-1 truncate">Qo'shiq</h2>
                <p id="fp-artist" class="text-blue-400 font-bold text-base truncate">San'atkor</p>
            </div>

            <!-- Progress -->
            <div class="mb-6">
                <div class="progress-container mb-2" onclick="seekAudio(event)">
                    <div id="fp-progress" class="progress-bar"></div>
                </div>
                <div class="flex justify-between text-xs font-bold text-white/30">
                    <span id="fp-current-time">0:00</span>
                    <span id="fp-duration">0:00</span>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="flex justify-between items-center px-2 mb-6">
                <button class="text-lg text-white/30"><i class="fas fa-shuffle"></i></button>
                <div class="flex items-center gap-6">
                    <button onclick="previousSong()" class="text-2xl text-white/80"><i class="fas fa-backward-step"></i></button>
                    <button onclick="togglePlay()" class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center shadow-lg">
                        <i id="fp-icon" class="fas fa-play text-2xl text-white ml-0.5"></i>
                    </button>
                    <button onclick="nextSong()" class="text-2xl text-white/80"><i class="fas fa-forward-step"></i></button>
                </div>
                <button onclick="openShareModal()" class="text-lg text-white/30"><i class="fas fa-share-alt"></i></button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="share-modal">
        <div class="share-sheet">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white font-bold">Ulashish</h3>
                <button onclick="closeShareModal()" class="text-white/50">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            
            <div class="flex gap-2 flex-wrap">
                <button onclick="shareTo('telegram')" class="flex flex-col items-center gap-1 p-3 glass-panel rounded-lg">
                    <i class="fab fa-telegram text-blue-500 text-xl"></i>
                    <span class="text-xs text-slate-300">Telegram</span>
                </button>
                <button onclick="shareTo('whatsapp')" class="flex flex-col items-center gap-1 p-3 glass-panel rounded-lg">
                    <i class="fab fa-whatsapp text-green-500 text-xl"></i>
                    <span class="text-xs text-slate-300">WhatsApp</span>
                </button>
                <button onclick="shareTo('copy')" class="flex flex-col items-center gap-1 p-3 glass-panel rounded-lg">
                    <i class="fas fa-copy text-purple-500 text-xl"></i>
                    <span class="text-xs text-slate-300">Nusxalash</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full glass-panel border-t border-white/5 pb-4 pt-2 px-6 flex justify-between items-center z-40 rounded-t-2xl">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-0.5 transition-all text-blue-500">
            <i class="fas fa-music text-lg"></i>
            <span class="text-xs font-bold">ASOSIY</span>
        </button>
        <button onclick="switchTab('news')" id="nav-news" class="flex flex-col items-center gap-0.5 transition-all text-slate-500">
            <i class="far fa-newspaper text-lg"></i>
            <span class="text-xs font-bold">YANGILIK</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-0.5 transition-all text-slate-500">
            <i class="far fa-user text-lg"></i>
            <span class="text-xs font-bold">PROFIL</span>
        </button>
    </nav>

    <audio id="main-audio"></audio>

    <script>
        // Test data - Yangiliklar uchun
        const testNews = [
            {
                title: "Yangi Qo'shiq Chiqdi",
                category: "YANGILIK",
                description: "Eng sog'ingan san'atkoringizdan yangi qo'shiq turli platformalarda mavjud!",
                image: "https://via.placeholder.com/400x200?text=New+Song"
            },
            {
                title: "Kontsert E'lonlandi",
                category: "E'LON",
                description: "2026 yilida yangi kontsert kunida bo'lib o'tadi. Chipta sotilishiga boshlandi!",
                image: "https://via.placeholder.com/400x200?text=Concert"
            },
            {
                title: "Top 10 Qo'shiqlar",
                category: "REJTING",
                description: "Bu hafta eng ko'p tinglangan qo'shiqlarni ko'ring va ozingiznikini qo'shing.",
                image: "https://via.placeholder.com/400x200?text=Top+10"
            }
        ];

        let audio = document.getElementById('main-audio');
        let currentSong = null;
        let currentSongIndex = -1;
        let allSongsFlat = [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let totalListeningHours = parseFloat(localStorage.getItem('listeningHours')) || 0;

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && !document.getElementById('full-player').classList.contains('active')) {
                e.preventDefault();
                togglePlay();
            }
            if(e.code === 'ArrowRight') nextSong();
            if(e.code === 'ArrowLeft') previousSong();
        });

        async function loadApp() {
            // Test qo'shiqlar
            const testSongs = [
                {
                    section: "Eng Yangi",
                    type: "list",
                    title: "Unutasan Jim",
                    artist: "Fayzulloh Zokirov",
                    url: "https://github.com/azziyy/Tabrik/raw/refs/heads/main/Mahmudjon_Inomjonov_Jahongir_Otajonov_happy_birthday_to_you.mp3",
                    img: "https://via.placeholder.com/300x300?text=Song1"
                },
                {
                    section: "Eng Yangi",
                    type: "list",
                    title: "O'ylamading",
                    artist: "Munisa Rizaeva",
                    url: "https://github.com/azziyy/Tabrik/raw/refs/heads/main/Mahmudjon_Inomjonov_Jahongir_Otajonov_happy_birthday_to_you.mp3",
                    img: "https://via.placeholder.com/300x300?text=Song2"
                },
                {
                    section: "Eng Yangi",
                    type: "list",
                    title: "Konsta",
                    artist: "Azizbek",
                    url: "https://github.com/azziyy/Tabrik/raw/refs/heads/main/Mahmudjon_Inomjonov_Jahongir_Otajonov_happy_birthday_to_you.mp3",
                    img: "https://via.placeholder.com/300x300?text=Song3"
                }
            ];

            renderSongs(testSongs);
            buildFlatSongsList(testSongs);
            renderNews();
            updateProfileStats();
            audio.volume = 0.7;
        }

        function renderSongs(songs) {
            const container = document.getElementById('dynamic-content');
            const groups = {};
            
            songs.forEach(song => {
                if (!groups[song.section]) {
                    groups[song.section] = {
                        title: song.section,
                        type: song.type,
                        songs: []
                    };
                }
                groups[song.section].songs.push(song);
            });

            let html = '';
            Object.values(groups).forEach(section => {
                html += `<div class="px-4 mt-6 mb-3"><h2 class="font-bold text-lg text-white">${section.title}</h2></div>`;
                html += `<div class="flex flex-col gap-2 px-4">`;
                
                section.songs.forEach(song => {
                    html += `
                    <div class="music-card p-2 flex items-center gap-3 cursor-pointer" onclick="playSong('${song.url}', '${song.title.replace(/'/g, "\\'")}', '${song.artist.replace(/'/g, "\\'")}', '${song.img}')">
                        <img src="${song.img}" class="w-12 h-12 rounded-lg object-cover shrink-0">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm text-white truncate">${song.title}</h3>
                            <p class="text-xs text-slate-400 truncate">${song.artist}</p>
                        </div>
                    </div>`;
                });
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function buildFlatSongsList(songs) {
            allSongsFlat = songs.map(s => ({
                title: s.title,
                artist: s.artist,
                url: s.url,
                img: s.img
            }));
        }

        function renderNews() {
            const newsArea = document.getElementById('news-area');
            let html = '';
            
            testNews.forEach(news => {
                html += `
                <div class="music-card rounded-lg overflow-hidden">
                    <img src="${news.image}" class="w-full h-32 object-cover">
                    <div class="p-4">
                        <span class="inline-block px-2 py-1 bg-blue-500/10 text-blue-400 text-xs font-bold mb-2">${news.category}</span>
                        <h3 class="text-base font-bold text-white mb-1">${news.title}</h3>
                        <p class="text-sm text-slate-400">${news.description}</p>
                    </div>
                </div>`;
            });

            newsArea.innerHTML = html;
        }

        function updateProfileStats() {
            document.getElementById('stat-songs').innerText = allSongsFlat.length;
            document.getElementById('stat-hours').innerText = Math.floor(totalListeningHours);
            document.getElementById('stat-favorites').innerText = favorites.length;
        }

        function switchTab(tab) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            const buttons = ['nav-home', 'nav-news', 'nav-profile'];
            buttons.forEach(btn => {
                document.getElementById(btn).classList.remove('text-blue-500');
                document.getElementById(btn).classList.add('text-slate-500');
            });
            
            const tabMap = {home: 'nav-home', news: 'nav-news', profile: 'nav-profile'};
            document.getElementById(tabMap[tab]).classList.add('text-blue-500');
            document.getElementById(tabMap[tab]).classList.remove('text-slate-500');

            if(tab === 'profile') updateProfileStats();
        }

        function playSong(url, title, artist, img) {
            currentSong = {url, title, artist, img};
            currentSongIndex = allSongsFlat.findIndex(s => s.url === url);
            
            audio.src = url;
            audio.play();
            
            document.getElementById('mini-player').classList.remove('hidden');
            document.getElementById('mp-title').innerText = title;
            document.getElementById('mp-artist').innerText = artist;
            document.getElementById('mp-img').src = img;
            
            document.getElementById('fp-title').innerText = title;
            document.getElementById('fp-artist').innerText = artist;
            document.getElementById('fp-img').src = img;
            document.getElementById('fp-bg-blur').src = img;
            
            updatePlayPauseUI(true);
            updateCurrentHeart();
        }

        function nextSong() {
            if(allSongsFlat.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % allSongsFlat.length;
            const song = allSongsFlat[currentSongIndex];
            playSong(song.url, song.title, song.artist, song.img);
        }

        function previousSong() {
            if(allSongsFlat.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + allSongsFlat.length) % allSongsFlat.length;
            const song = allSongsFlat[currentSongIndex];
            playSong(song.url, song.title, song.artist, song.img);
        }

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if(!audio.src) return;

            if(audio.paused) {
                audio.play();
                updatePlayPauseUI(true);
            } else {
                audio.pause();
                updatePlayPauseUI(false);
            }
        }

        function updatePlayPauseUI(isPlaying) {
            const mpIcon = document.getElementById('mp-icon');
            const fpIcon = document.getElementById('fp-icon');

            if(isPlaying) {
                mpIcon.className = 'fas fa-pause text-white text-xs';
                fpIcon.className = 'fas fa-pause text-white text-2xl';
            } else {
                mpIcon.className = 'fas fa-play text-white text-xs ml-0.5';
                fpIcon.className = 'fas fa-play text-white text-2xl ml-1';
            }
        }

        audio.addEventListener('timeupdate', () => {
            if(!audio.duration) return;
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('fp-progress').style.width = `${progressPercent}%`;
            document.getElementById('fp-current-time').innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('fp-duration').innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            totalListeningHours += audio.duration / 3600;
            localStorage.setItem('listeningHours', totalListeningHours);
            nextSong();
        });

        function seekAudio(e) {
            if(!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            audio.currentTime = (clickX / width) * audio.duration;
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function openFullPlayer() {
            document.getElementById('full-player').classList.add('active');
        }

        function closeFullPlayer() {
            document.getElementById('full-player').classList.remove('active');
        }

        function toggleFavoriteCurrent() {
            if(!currentSong) return;
            const index = favorites.findIndex(f => f.url === currentSong.url);
            if(index > -1) favorites.splice(index, 1);
            else favorites.push(currentSong);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateCurrentHeart();
            updateProfileStats();
        }

        function updateCurrentHeart() {
            if(!currentSong) return;
            const isFav = favorites.some(f => f.url === currentSong.url);
            const fpHeart = document.getElementById('fp-heart');
            if(isFav) {
                fpHeart.className = 'fas fa-heart text-red-500';
            } else {
                fpHeart.className = 'far fa-heart text-white/70';
            }
        }

        function showFavorites() {
            switchTab('favorites');
            let html = '';
            favorites.forEach(f => {
                html += `
                <div class="music-card p-2 flex items-center gap-3 cursor-pointer" onclick="playSong('${f.url}', '${f.title.replace(/'/g, "\\'")}', '${f.artist.replace(/'/g, "\\'")}', '${f.img}')">
                    <img src="${f.img}" class="w-12 h-12 rounded-lg object-cover shrink-0">
                    <div class="flex-1">
                        <h3 class="font-bold text-sm text-white truncate">${f.title}</h3>
                        <p class="text-xs text-slate-400 truncate">${f.artist}</p>
                    </div>
                    <i class="fas fa-heart text-red-500"></i>
                </div>`;
            });
            document.getElementById('favorites-area').innerHTML = html || `<p class="text-center text-slate-400 mt-8">Sevimli qo'shiq yo'q</p>`;
        }

        function openShareModal() {
            document.getElementById('share-modal').classList.add('active');
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('active');
        }

        function shareTo(platform) {
            if(!currentSong) return;
            const text = `🎵 "${currentSong.title}" - ${currentSong.artist}\n🎧 Azizbek PRO App`;
            
            if(platform === 'copy') {
                navigator.clipboard.writeText(text);
                alert('✅ Nusxalandi!');
            } else if(platform === 'telegram') {
                window.open(`https://t.me/share/url?text=${encodeURIComponent(text)}`, '_blank');
            } else if(platform === 'whatsapp') {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            }
            closeShareModal();
        }

        window.onload = loadApp;
    </script>
</body>
</html>
